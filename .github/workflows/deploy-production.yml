name: Prepare production release
run-name: Prepare ${{ github.sha }} for production

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-prepare
  cancel-in-progress: false

env:
  AWS_REGION: ap-southeast-1
  ECR_REGISTRY: 401696231252.dkr.ecr.ap-southeast-1.amazonaws.com
  API_REPOSITORY: mem9-node-prod-api
  WORKER_REPOSITORY: mem9-node-prod-worker
  TF_STATE_BUCKET: mem9-node-prod-terraform-state
  TF_STATE_KMS_KEY_ARN: arn:aws:kms:ap-southeast-1:401696231252:key/4cd4c7a1-c1a6-47ad-9205-548678b84d86
  TERRAFORM_VERSION: 1.15.4
  TF_WORKING_DIR: infra/terraform
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

jobs:
  prepare:
    name: Build images and plan current main
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out the release commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}

      - name: Verify release source
        run: |
          test "$GITHUB_REF" = "refs/heads/main"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Configure AWS image credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::401696231252:role/mem9-node-prod-github-prepare
          role-session-name: mem9-node-production-images
          aws-region: ${{ env.AWS_REGION }}
          mask-aws-account-id: true

      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push API image
        run: |
          if aws ecr describe-images \
            --repository-name "$API_REPOSITORY" \
            --image-ids "imageTag=$GITHUB_SHA" \
            --region "$AWS_REGION" > /dev/null 2>&1; then
            echo "API image $GITHUB_SHA already exists; reusing it."
          else
            docker build \
              --platform linux/amd64 \
              --file apps/api/Dockerfile \
              --tag "$ECR_REGISTRY/$API_REPOSITORY:$GITHUB_SHA" \
              .
            docker push "$ECR_REGISTRY/$API_REPOSITORY:$GITHUB_SHA"
          fi

      - name: Build and push worker image
        run: |
          if aws ecr describe-images \
            --repository-name "$WORKER_REPOSITORY" \
            --image-ids "imageTag=$GITHUB_SHA" \
            --region "$AWS_REGION" > /dev/null 2>&1; then
            echo "Worker image $GITHUB_SHA already exists; reusing it."
          else
            docker build \
              --platform linux/amd64 \
              --file apps/worker/Dockerfile \
              --tag "$ECR_REGISTRY/$WORKER_REPOSITORY:$GITHUB_SHA" \
              .
            docker push "$ECR_REGISTRY/$WORKER_REPOSITORY:$GITHUB_SHA"
          fi

      - name: Lock release images
        run: |
          API_IMAGE="$ECR_REGISTRY/$API_REPOSITORY:$GITHUB_SHA"
          WORKER_IMAGE="$ECR_REGISTRY/$WORKER_REPOSITORY:$GITHUB_SHA"
          API_DIGEST=$(aws ecr describe-images \
            --repository-name "$API_REPOSITORY" \
            --image-ids "imageTag=$GITHUB_SHA" \
            --query 'imageDetails[0].imageDigest' \
            --output text \
            --region "$AWS_REGION")
          WORKER_DIGEST=$(aws ecr describe-images \
            --repository-name "$WORKER_REPOSITORY" \
            --image-ids "imageTag=$GITHUB_SHA" \
            --query 'imageDetails[0].imageDigest' \
            --output text \
            --region "$AWS_REGION")

          test -n "$API_DIGEST" && test "$API_DIGEST" != "None"
          test -n "$WORKER_DIGEST" && test "$WORKER_DIGEST" != "None"

          {
            echo "API_IMAGE=$API_IMAGE"
            echo "WORKER_IMAGE=$WORKER_IMAGE"
            echo "API_DIGEST=$API_DIGEST"
            echo "WORKER_DIGEST=$WORKER_DIGEST"
          } >> "$GITHUB_ENV"

      - name: Verify release image contents
        run: |
          docker pull "$API_IMAGE"
          docker pull "$WORKER_IMAGE"
          docker run --rm --entrypoint test "$API_IMAGE" \
            -f /app/apps/api/dist/apps/api/src/main.js
          docker run --rm --entrypoint test "$WORKER_IMAGE" \
            -f /app/apps/worker/dist/apps/worker/src/main.js

      - name: Configure AWS Terraform credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::401696231252:role/mem9-node-prod-github-apply
          role-session-name: mem9-node-production-plan
          aws-region: ${{ env.AWS_REGION }}
          mask-aws-account-id: true

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Write production variables
        env:
          TF_VARS: ${{ secrets.TF_VARS }}
        run: |
          test -n "$TF_VARS"
          printf '%s\n' "$TF_VARS" > "$TF_WORKING_DIR/production.auto.tfvars"

      - name: Initialize Terraform
        run: |
          terraform -chdir="$TF_WORKING_DIR" init \
            -input=false \
            -backend-config="bucket=$TF_STATE_BUCKET" \
            -backend-config="key=mem9-node/production/terraform.tfstate" \
            -backend-config="region=$AWS_REGION" \
            -backend-config="encrypt=true" \
            -backend-config="kms_key_id=$TF_STATE_KMS_KEY_ARN" \
            -backend-config="use_lockfile=true"

      - name: Plan production release
        run: |
          terraform -chdir="$TF_WORKING_DIR" plan \
            -input=false \
            -var="release_id=$GITHUB_SHA" \
            -var="api_image=$API_IMAGE" \
            -var="worker_image=$WORKER_IMAGE" \
            -out=tfplan

      - name: Summarize prepared release
        run: |
          PLAN_JSON=$(mktemp)
          terraform -chdir="$TF_WORKING_DIR" show -json tfplan > "$PLAN_JSON"

          ADD_COUNT=$(jq '[.resource_changes[]? | select(.change.actions | index("create"))] | length' "$PLAN_JSON")
          CHANGE_COUNT=$(jq '[.resource_changes[]? | select(.change.actions | index("update"))] | length' "$PLAN_JSON")
          DESTROY_COUNT=$(jq '[.resource_changes[]? | select(.change.actions | index("delete"))] | length' "$PLAN_JSON")

          {
            echo "## Production preparation"
            echo
            echo "- Release: \`$GITHUB_SHA\`"
            echo "- API image: \`$API_IMAGE@$API_DIGEST\`"
            echo "- Worker image: \`$WORKER_IMAGE@$WORKER_DIGEST\`"
            echo "- Image contents: verified"
            echo "- Terraform: **$ADD_COUNT add**, **$CHANGE_COUNT change**, **$DESTROY_COUNT destroy**"
            echo "- Terraform apply: not run"
            echo "- ECS services: unchanged"
            echo "- Database migration: not run"
          } >> "$GITHUB_STEP_SUMMARY"
