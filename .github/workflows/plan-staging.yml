name: Plan staging
run-name: Plan ${{ inputs.ref }} for staging

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag, or commit to plan for staging
        required: true
        default: main
        type: string

permissions:
  contents: read

concurrency:
  group: staging-plan
  cancel-in-progress: true

env:
  SOURCE_REF: ${{ inputs.ref }}
  AWS_REGION: ap-southeast-1
  ECR_REGISTRY: 401696231252.dkr.ecr.ap-southeast-1.amazonaws.com
  API_REPOSITORY: mem9-node-staging-api
  WORKER_REPOSITORY: mem9-node-staging-worker
  TF_STATE_BUCKET: mem9-node-prod-terraform-state
  TF_STATE_KMS_KEY_ARN: arn:aws:kms:ap-southeast-1:401696231252:key/4cd4c7a1-c1a6-47ad-9205-548678b84d86
  TERRAFORM_VERSION: 1.15.4
  TF_WORKING_DIR: infra/terraform
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

jobs:
  plan:
    name: Plan selected branch for staging
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out the selected commit
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}

      - name: Verify selected source
        run: |
          git fetch --no-tags --depth=1 origin main
          if ! git diff --quiet FETCH_HEAD -- infra/terraform; then
            echo "The selected ref changes infra/terraform. Merge reviewed Terraform changes to main before running this privileged workflow." >&2
            exit 1
          fi
          echo "RELEASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Configure AWS staging credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::401696231252:role/mem9-node-staging-github-plan
          role-session-name: mem9-node-staging-plan
          aws-region: ${{ env.AWS_REGION }}
          mask-aws-account-id: true

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Write staging variables
        env:
          STAGING_TF_VARS: ${{ secrets.STAGING_TF_VARS }}
        run: |
          test -n "$STAGING_TF_VARS"
          printf '%s\n' "$STAGING_TF_VARS" > "$TF_WORKING_DIR/staging.auto.tfvars"

      - name: Initialize staging Terraform
        run: |
          terraform -chdir="$TF_WORKING_DIR" init \
            -input=false \
            -backend-config="bucket=$TF_STATE_BUCKET" \
            -backend-config="key=mem9-node/staging/terraform.tfstate" \
            -backend-config="region=$AWS_REGION" \
            -backend-config="encrypt=true" \
            -backend-config="kms_key_id=$TF_STATE_KMS_KEY_ARN" \
            -backend-config="use_lockfile=true"

      - name: Plan staging infrastructure
        run: |
          API_IMAGE="$ECR_REGISTRY/$API_REPOSITORY:$RELEASE_SHA"
          WORKER_IMAGE="$ECR_REGISTRY/$WORKER_REPOSITORY:$RELEASE_SHA"

          terraform -chdir="$TF_WORKING_DIR" plan \
            -input=false \
            -lock=false \
            -var="release_id=$RELEASE_SHA" \
            -var="api_image=$API_IMAGE" \
            -var="worker_image=$WORKER_IMAGE" \
            -var="api_desired_count=0" \
            -var="worker_desired_count=0" \
            -out="$RUNNER_TEMP/staging.tfplan"

      - name: Summarize staging plan
        run: |
          PLAN_JSON="$RUNNER_TEMP/staging-plan.json"
          terraform -chdir="$TF_WORKING_DIR" show -json "$RUNNER_TEMP/staging.tfplan" > "$PLAN_JSON"

          ADD_COUNT=$(jq '[.resource_changes[]? | select(.change.actions | index("create"))] | length' "$PLAN_JSON")
          CHANGE_COUNT=$(jq '[.resource_changes[]? | select(.change.actions | index("update"))] | length' "$PLAN_JSON")
          DESTROY_COUNT=$(jq '[.resource_changes[]? | select(.change.actions | index("delete"))] | length' "$PLAN_JSON")

          {
            echo "## Staging plan only"
            echo
            echo "- Source ref: \`$SOURCE_REF\`"
            echo "- Release: \`$RELEASE_SHA\`"
            echo "- Terraform: **$ADD_COUNT add**, **$CHANGE_COUNT change**, **$DESTROY_COUNT destroy**"
            echo "- Bootstrap task counts: **API 0**, **Worker 0**"
            echo "- Apply: **disabled**"
            echo "- Images: **not built or pushed**"
          } >> "$GITHUB_STEP_SUMMARY"
